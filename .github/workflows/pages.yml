# 作品のデータ（entries/）が変わったら、カタログ（public/index.json など）を作り直して、GitHub Pages に置く。
#  1. 試験と、カタログの作り直し
#  2. 作り直したカタログ（public/）をリポジトリに入れる（jsDelivr がコミットを固定して配れるように）
#  3. meta.json（指紋・写しのURL）を作って、ページと一緒に GitHub Pages に置く
name: カタログを作って公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      - name: カタログを作り直す
        run: node scripts/build.mjs
      - name: 作り直したカタログをリポジトリに入れる
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if ! git diff --cached --quiet; then
            git commit -m "カタログを作り直す [skip ci]"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 配る形にそろえる（meta.json）
        run: node scripts/build.mjs --meta "${{ steps.commit.outputs.sha }}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
